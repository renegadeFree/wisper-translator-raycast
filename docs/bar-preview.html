<!doctype html>
<html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wisper · Anteprima della barra</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#f3f3f6;background:#111118;font-family:"Segoe UI",system-ui,sans-serif}button,select,input{font:inherit}button{cursor:pointer}header{position:absolute;inset:36px 48px auto;display:flex;justify-content:space-between;align-items:center;z-index:2}.brand{font-size:16px;font-weight:600;letter-spacing:-.3px}.brand span{color:#9292a3;font-size:12px;font-weight:400;margin-left:14px}.tag{font-size:10px;letter-spacing:1.8px;color:#9292a3}main{min-height:100vh;display:grid;place-items:center;padding:125px 20px 170px;overflow:hidden;background:radial-gradient(ellipse at 80% 18%,#473b5544,transparent 50%),radial-gradient(ellipse at 15% 75%,#39475455,transparent 60%)}.landscape{position:absolute;inset:0;overflow:hidden;pointer-events:none}.landscape:before{content:"";position:absolute;width:120vw;height:50vh;left:-10vw;top:38vh;border-radius:50%;transform:rotate(-12deg);background:linear-gradient(20deg,#26374266,#6c657755,transparent)}.landscape:after{content:"";position:absolute;width:120vw;height:48vh;left:-10vw;top:55vh;border-radius:50%;transform:rotate(12deg);background:linear-gradient(170deg,#272839,#13151d)}.stage{z-index:1;position:relative;max-width:100%}.bar{width:760px;max-width:100%;border:1px solid #ffffff35;border-radius:18px;overflow:hidden;background:linear-gradient(140deg,#ffffff0c,transparent 55%,#00000006),#181821a6;backdrop-filter:blur(32px) saturate(125%);box-shadow:0 22px 70px #0007,0 2px 8px #0003}.handle{height:48px;padding:0 12px 0 16px;display:flex;align-items:center;gap:12px}.status{display:flex;align-items:center;flex:1;min-width:0;gap:12px}.dot{width:6px;height:6px;flex:none;border-radius:50%;background:#f58b73}.status strong{display:block;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status small{display:block;font-size:10px;color:#9292a3}.controls{display:flex;align-items:center;gap:3px}.icon{width:30px;height:30px;border-radius:8px;border:1px solid transparent;background:transparent;color:#b4b4c2;display:grid;place-items:center;padding:0}.icon:hover{background:#ffffff1a;color:#f3f3f6}.icon:focus-visible{outline:1px solid #ff8b73}.icon.active{background:#ffffff12;color:#f3f3f6}.icon.off{color:#777786}.icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.divider{width:1px;height:16px;background:#ffffff20;margin:0 7px}.primary{width:34px;background:#ff5a5a;color:white}.primary:hover{background:#ff7777}.body{height:160px;margin:0 8px 6px;overflow:auto;scrollbar-width:none}.body::-webkit-scrollbar{display:none}.cue{height:76px;margin-bottom:4px;background:#ffffff12;border-radius:10px;padding:7px 12px;display:flex;gap:10px}.line{width:3px;flex:none;border-radius:2px;background:var(--speaker);opacity:.75;margin:3px 0}.text{flex:1;min-width:0}.meta{height:18px;display:flex;gap:10px;align-items:baseline}.speaker{font-size:10.5px;font-weight:600;color:var(--speaker);white-space:nowrap}.original{font-size:11.5px;color:#b4b4c2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.translation{font-size:15px;line-height:20px;font-weight:500;max-height:40px;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}.footer{height:32px;padding:0 8px 0 14px;border-top:1px solid #ffffff16;display:flex;align-items:center;justify-content:space-between}.direction{font-size:10.5px;color:#b4b4c2;font-weight:600}.mode{font-size:10.5px;color:#9292a3}.foot-actions{display:flex;align-items:center;gap:3px}.shortcut{font-size:10px;color:#9292a3;margin-right:7px}.footer .icon{height:24px}.caption{position:absolute;top:calc(100% + 24px);left:0;right:0;font-size:11px;color:#9292a3;text-align:center}.idle{display:none;height:44px;align-items:center;justify-content:center;color:#b4b4c2;font-size:13px}.bar.idling .body{height:44px}.bar.idling .cues{display:none}.bar.idling .idle{display:flex}.bar.idling .dot{opacity:.45}.bar.idling .primary{background:#ff7a59}.bar.idling .primary svg{fill:currentColor;stroke-width:0}.panel{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);border:1px solid #ffffff15;background:#15151deb;border-radius:12px;display:flex;align-items:center;gap:22px;padding:14px 18px;z-index:2;font-size:11px;color:#b4b4c2}.panel label{white-space:nowrap;display:flex;align-items:center;gap:8px}.panel select{background:#24242e;border:1px solid #ffffff20;border-radius:5px;color:#f3f3f6;padding:5px}.panel input{width:100px;accent-color:#f58b73}.panel button{white-space:nowrap;border:1px solid #ffffff20;border-radius:6px;background:#24242e;color:#f3f3f6;padding:6px 10px}.menu{display:none;position:absolute;right:38px;bottom:38px;background:#22222cf5;border:1px solid #ffffff28;border-radius:12px;box-shadow:0 8px 30px #0005;padding:6px;min-width:190px;font-size:12px;z-index:3}.menu button{display:block;width:100%;text-align:left;background:none;border:0;color:#f3f3f6;border-radius:6px;padding:8px 10px}.menu button:hover{background:#ffffff12}.menu.open{display:block}@media(max-width:650px){header{inset:25px 20px auto}.tag,.brand span{display:none}.panel{width:calc(100% - 24px);flex-wrap:wrap;justify-content:center;gap:12px}.shortcut{display:none}.caption{font-size:10px}}
</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="speaker" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM15 8c3 2 3 6 0 8M18 5c5 4 5 10 0 14"/></symbol>
<symbol id="mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M6 10v2a6 6 0 0 0 12 0v-2M12 18v3M9 21h6"/></symbol>
<symbol id="translate" viewBox="0 0 24 24"><path d="M3 5h11M8 3v2M5 8c1 4 4 6 8 8M12 5c-1 5-4 9-9 12M14 21l4-10 4 10M16 17h4"/></symbol>
<symbol id="people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 4v2"/></symbol>
<symbol id="stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1" fill="currentColor" stroke="none"/></symbol>
<symbol id="play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z" fill="currentColor" stroke="none"/></symbol>
<symbol id="more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
<symbol id="close" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></symbol>
</defs></svg>
<header><div class="brand">Wisper<span>Trascrizione e traduzione locale</span></div><div class="tag">FLOATING BAR · DESIGN PREVIEW</div></header>
<main><div class="landscape"></div><div class="stage"><section class="bar" aria-label="Barra trascrizione">
<div class="handle"><div class="status"><span class="dot"></span><div><strong id="status">In ascolto</strong><small>Tu · Speaker 2</small></div></div><div class="controls">
<button class="icon active" title="Audio di sistema" aria-label="Audio di sistema"><svg><use href="#speaker"/></svg></button>
<button class="icon active" title="Microfono" aria-label="Microfono"><svg><use href="#mic"/></svg></button>
<button class="icon active" title="Traduzione" aria-label="Traduzione"><svg><use href="#translate"/></svg></button>
<button class="icon active" title="Distingui i parlanti" aria-label="Distingui i parlanti"><svg><use href="#people"/></svg></button>
<span class="divider"></span><button class="icon primary" id="start" title="Ferma la sessione" aria-label="Avvia o ferma"><svg><use href="#stop"/></svg></button></div></div>
<div class="body"><div class="idle">Premi Avvia per i sottotitoli</div><div class="cues"></div></div>
<div class="footer"><div><span class="direction">IT → EN</span><span class="mode"> · Traduzione</span></div><div class="foot-actions"><span class="shortcut">Ctrl Alt B</span><button class="icon" id="more" aria-label="Altri comandi"><svg><use href="#more"/></svg></button><button class="icon" id="hide" aria-label="Nascondi barra"><svg><use href="#close"/></svg></button></div></div>
</section><div class="menu"><button>Cambia direzione</button><button>Testo mostrato</button><button>Modalità discreta</button><button>Apri pannello</button><button>Impostazioni</button></div><div class="caption">Anteprima HTML del layout WPF · il materiale DWM effettivo richiede Windows</div></div></main>
<div class="panel"><label>Larghezza <input id="width" type="range" min="480" max="1200" value="760"><output id="pixels">760 px</output></label><label>Testo <select id="mode"><option value="both">Entrambi</option><option value="original">Originale</option><option value="translation">Traduzione</option></select></label><button id="idle">Stato a riposo</button></div>
<script>
const samples=[{speaker:'Tu',color:'#A7F3D0',original:'Allora, per la riunione di domani preparo io la presentazione e tu ricontrolli i numeri del bilancio.',translation:"So, for tomorrow’s meeting I’ll prepare the presentation and you double-check the budget figures."},{speaker:'Speaker 2',color:'#93C5FD',original:'Perfetto, allora stasera mando il file aggiornato a tutto il team così ognuno lo legge prima.',translation:'Perfect, so tonight I’ll send the updated file to the whole team so everyone can read it beforehand.'},{speaker:'Speaker 1',color:'#FCA5A5',original:'Aspetta, il preventivo non è ancora approvato: meglio aspettare lunedì prima di condividerlo.',translation:'Hold on, the quote hasn’t been approved yet:'}];
const bar=document.querySelector('.bar');
function render(){const mode=document.querySelector('#mode').value;document.querySelector('.cues').replaceChildren(...samples.map(cue=>{const row=document.createElement('div');row.className='cue';row.style.setProperty('--speaker',cue.color);row.innerHTML='<span class="line"></span><div class="text"><div class="meta"><span class="speaker"></span><span class="original"></span></div><div class="translation"></div></div>';row.querySelector('.speaker').textContent=cue.speaker;row.querySelector('.original').textContent=mode==='both'?cue.original:'';row.querySelector('.translation').textContent=mode==='original'?cue.original:cue.translation;return row}));}
function idle(){const off=bar.classList.toggle('idling');document.querySelector('#status').textContent=off?'Pronto':'In ascolto';document.querySelector('#start use').setAttribute('href',off?'#play':'#stop');document.querySelector('#idle').textContent=off?'Stato in ascolto':'Stato a riposo';}
document.querySelector('#width').oninput=e=>{bar.style.width=e.target.value+'px';document.querySelector('#pixels').textContent=e.target.value+' px';};document.querySelector('#mode').onchange=render;document.querySelector('#idle').onclick=idle;document.querySelector('#start').onclick=idle;document.querySelector('#more').onclick=()=>document.querySelector('.menu').classList.toggle('open');document.querySelector('#hide').onclick=idle;document.querySelectorAll('.controls .icon:not(.primary)').forEach(button=>button.onclick=()=>{button.classList.toggle('active');button.classList.toggle('off');});render();
</script></html>
